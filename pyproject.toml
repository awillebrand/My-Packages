[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "astro-tools"
version = "0.1.0"
description = "Astrodynamics tools - orbit propagation, coordinate transformations, measurement processing, and filtering"
requires-python = ">=3.8"
authors = [
    {name = "awillebrand"}
]
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "plotly"
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools. packages.find]
where = ["."]
include = ["ASEN_6080*", "Tools*"]